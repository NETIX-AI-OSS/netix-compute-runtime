name: Public runtime
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned secret scanner
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/netix-gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/netix-gitleaks"
          echo "$RUNNER_TEMP/netix-gitleaks" >> "$GITHUB_PATH"
      - run: gitleaks git --redact=100 --log-opts=--all .
      - name: Check public ownership boundary
        run: |
          python3 - <<'PYTHON'
          import pathlib
          denied = {'.env', 'vision_ai', 'models', 'datasets', 'training_data', 'qualification', 'worker_data'}
          for path in pathlib.Path('.').rglob('*'):
              if '.git' in path.parts:
                  continue
              assert not any(part in denied for part in path.parts), path
              assert path.suffix not in {'.safetensors', '.gguf', '.pt', '.pem', '.key'}, path
          PYTHON
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -I -m unittest discover -s tests
      - run: python -m unittest discover -s runtime/host_manager -p 'test_*.py'
      - run: netix-runtime-supervisor --help
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.14'
        with:
          name: runtime-wheel
          path: dist/*.whl
  image:
    needs: [audit, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/netix-ai-oss/netix-compute-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build model-independent base
        run: docker build -t "$IMAGE:sha-$GITHUB_SHA" .
      - name: Test packaged boundary
        run: |
          docker run --rm --network none "$IMAGE:sha-$GITHUB_SHA" --help
          docker run --rm --network none --entrypoint python "$IMAGE:sha-$GITHUB_SHA" -I -c '
          import importlib.util, importlib.metadata
          from runtime.host_manager.supervisor import load_config
          assert not importlib.metadata.requires("netix-compute-runtime")
          for name in ("vision_ai", "torch", "transformers", "django", "ultralytics"):
              assert importlib.util.find_spec(name) is None, name'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable base
        if: github.event_name != 'pull_request'
        id: publish
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          DIGEST=$(docker image inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@v3
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/netix-ai-oss/netix-compute-runtime
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify published image provenance
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://$IMAGE@${{ steps.publish.outputs.digest }}" \
            --repo NETIX-AI-OSS/netix-compute-runtime --source-digest "$GITHUB_SHA" \
            --signer-workflow NETIX-AI-OSS/netix-compute-runtime/.github/workflows/runtime.yml
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: runtime-wheel
          path: dist
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.whl
      - name: Publish wheel release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl --verify-tag --generate-notes
